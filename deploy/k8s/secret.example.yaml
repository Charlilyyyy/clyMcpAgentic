# Atlas-MCP — SECRET TEMPLATE (do not commit real values).
#
# This file documents the required secret keys. In production DO NOT apply
# this literal manifest. Instead, source these values from your secret
# manager and never let them touch git:
#
#   External Secrets Operator (recommended):
#     kind: ExternalSecret -> pulls from AWS Secrets Manager / Vault / GSM.
#
#   Sealed Secrets:
#     kubeseal < secret.yaml > sealed-secret.yaml   # the sealed file is safe to commit.
#
#   Raw (dev/staging only), from a local .env never checked in:
#     kubectl create secret generic atlas-mcp-secrets \
#       --from-env-file=.env.production
#
# The application reads these as ordinary environment variables via `envFrom`.
apiVersion: v1
kind: Secret
metadata:
  name: atlas-mcp-secrets
  labels:
    app.kubernetes.io/name: atlas-mcp
type: Opaque
stringData:
  # Data-plane connection strings (contain credentials).
  ATLAS_POSTGRES_DSN: "postgresql://REPLACE_USER:REPLACE_PASSWORD@atlas-postgres:5432/atlas"
  ATLAS_ELASTICSEARCH_URL: "http://atlas-elasticsearch:9200"
  ATLAS_S3_ENDPOINT: "https://s3.amazonaws.com"
  ATLAS_S3_BUCKET: "atlas-mcp-data"
  ATLAS_VECTOR_DB_URL: "http://atlas-qdrant:6333"

  # Model / embedding provider keys.
  ANTHROPIC_API_KEY: "REPLACE_ME"
  ATLAS_EMBEDDING_URL: "https://api.openai.com/v1"
  ATLAS_EMBEDDING_KEY: "REPLACE_ME"

  # Object-store credentials if not using IAM roles / IRSA.
  AWS_ACCESS_KEY_ID: "REPLACE_ME"
  AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
