apiVersion: v1
kind: Service
metadata:
  name: atlas-mcp
  labels:
    app.kubernetes.io/name: atlas-mcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Horizontal autoscaling on CPU. Because the server is stateless, adding
# replicas linearly increases throughput; Redis-backed rate limits and cache
# remain correct across the fleet.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: atlas-mcp
  labels:
    app.kubernetes.io/name: atlas-mcp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: atlas-mcp
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
# Keep at least 2 pods available during voluntary disruptions (node drains,
# rolling upgrades) so a maintenance window never causes an outage.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-mcp
  labels:
    app.kubernetes.io/name: atlas-mcp
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-mcp
